[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mflix-ingest"
version = "1.0.0"
description = "Ingestao moderna de dados — sample_mflix (MongoDB) -> Databricks Bronze (Delta)"
requires-python = ">=3.10"
dependencies = [
    "pymongo>=4.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "spark: testes que exigem uma SparkSession local (desativados por padrao)",
]
